name: PowerShell validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate with Windows PowerShell
        shell: powershell
        run: .\tests\Static.Tests.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\tests\Static.Tests.ps1
